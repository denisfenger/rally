<!DOCTYPE html>
<!-- Rally live scoreboard (static, GitHub Pages).
     Followers are free and account-less by product law: this page needs no
     login, loads NO external script or style, and stores nothing about the
     match. It joins a share through the share-join edge function (POST
     {code}) and then polls share-state (POST {shareId}) over plain fetch:
     every 2.5 s, one request in flight at a time, backing off to 10 s
     after three consecutive failures, pausing while the tab is hidden and
     resuming on visibilitychange.
     Request and response shapes: supabase/functions/share-join/index.ts and
     supabase/functions/share-state/index.ts. share-state carries no per-IP
     rate limit by design (a club's Wi-Fi is one address); share-join keeps
     its 30 per 10 minutes against code guessing.
     A SHARE IS A MATCH (feedback round 14, decision 6, reversing round 7
     decision 12): a code covers one match. The host's final uplink is the
     ended snapshot, which this page renders as the result (winner tag, no
     serve dot, the status worded as a result), and share-end deletes the
     row right after it, so the 404 that follows from share-state is the
     end of the follow. A 404 without an ended snapshot means the host
     stopped sharing mid-match (or the share idled out): the last score
     stays with "sharing ended". Nothing rolls over to a next match under
     the same code; the next match has a new code.
     YOUR TEAM (decision 7): Team A, Team B or Neutral, default Neutral.
     Picking a side marks that tile as yours and words the result from your
     side ("you won"); the colours NEVER change: blue is the host's team and
     clay the other on every Rally screen, so "which colour are we" has one
     answer. The choice belongs to ONE SHARE (round 14 verify): it is
     remembered in localStorage together with the share id it was made
     for, so the same code on a reload keeps it and any other share
     starts Neutral again, the way the app's follow screens do. A side
     in a match last week says nothing about who you are in this one.
     SWAP SIDES (decision 7): a per-device VIEW setting, the same one the
     Board and the watch have. It swaps which team is drawn left and right
     on this browser, for every share; the colours stay with their teams,
     the serve dot follows its team, the names follow their tiles, and
     the round-1 default (the host's team left) is what everyone who never
     touches it keeps. Remembered in localStorage per browser.
     Those two viewer preferences are ALL this page stores; never anything
     about the match.
     Participants' NAMES travel with a share (round 7, decision 10): the
     tiles read "Denis & Eric" instead of Team A, shortened to the shortest
     unambiguous form within the match (decision 11). Ids never reach this
     page.
     The anon key is public by design: it grants nothing, the table is
     service-role-only and every mutation goes through edge functions.
     The rendering is the scoreboard the app's Board and follow screen use:
     blue left = the host's side, clay right = the other side, sets table,
     serve dot, stale dot amber after 20 s without a successful poll.
     The app links here through boardUrl() in src/links.ts; the URL shape is
     board/?code=123456 and must stay stable.
     Verified by scripts/verify-board.mjs (headless Edge, the two POSTs
     answered by a scripted relay). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rally live score</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<style>
  :root {
    --ground: #0B1622;
    --panel: #101E2E;
    --line: #1C2C3E;
    --text: #E8EEF5;
    --muted: #7C8CA0;
    --us: #5B96E8;
    --them: #E08350;
    --live: #4C9E6B;
    --stale: #E0A830;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  #sport { font-size: 15px; font-weight: 600; letter-spacing: 0.04em;
    text-transform: lowercase; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  #status { display: flex; align-items: center; gap: 8px; font-size: 13px;
    color: var(--muted); flex: none; }
  #dot { width: 10px; height: 10px; border-radius: 50%; flex: none;
    background: var(--live); }
  #dot.stale { background: var(--stale); }
  #dot.off { background: var(--muted); }
  main { flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; padding: 24px 16px;
    gap: 28px; }
  #banner { display: none; flex-direction: column; align-items: center;
    gap: 8px; }
  #banner.show { display: flex; }
  #bannerTitle { font-size: 15px; color: var(--muted);
    letter-spacing: 0.06em; text-transform: uppercase; }
  #bannerHint { font-size: 14px; color: var(--muted); text-align: center;
    max-width: 30em; }
  #bannerHint:empty { display: none; }
  #score { display: flex; align-items: center; justify-content: center;
    flex-wrap: wrap; gap: 20px 6vw; max-width: 100%; }
  .side { display: flex; flex-direction: column; align-items: center;
    gap: 10px; min-width: 128px; max-width: 46vw; }
  /* Phones: the sets table drops under the two sides instead of pushing
     them past the edge (five sets beside 64 px points do not fit in
     360 px). The ::after item is the line break; the table takes the
     next row, centered. */
  @media (max-width: 480px) {
    .side { min-width: 96px; }
    #score::after { content: ""; flex-basis: 100%; height: 0; order: 2; }
    #setsTable { order: 3; }
  }
  /* The side label above the points: the participants' names when the
     share carries them (decision 10), else Team A / Team B. Same idiom
     as the app's tiles (13 pt, uppercase, ink-soft). */
  .side-name { display: flex; align-items: center; justify-content: center;
    gap: 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); max-width: 100%;
    text-align: center; }
  .side-name .label { overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  /* "you": the follower's own side (decision 7). A small pill next to
     the name; the tile's colour is its team's and does not move. */
  .side-name .you { display: none; font-size: 10px; letter-spacing: 0.08em;
    padding: 2px 6px; border-radius: 999px; border: 1px solid var(--text);
    color: var(--text); flex: none; }
  .side.mine .side-name .you { display: inline-block; }
  .side.mine .side-name { color: var(--text); }
  .points { font-size: clamp(64px, 18vw, 148px); font-weight: 700;
    line-height: 1; font-variant-numeric: tabular-nums; }
  .side.a .points { color: var(--us); }
  .side.b .points { color: var(--them); }
  .sets-won { font-size: 15px; color: var(--muted); }
  .sets-won b { color: var(--text); font-size: 17px; }
  .serve { width: 12px; height: 12px; border-radius: 50%;
    visibility: hidden; }
  .side.a .serve { background: var(--us); }
  .side.b .serve { background: var(--them); }
  .side.serving .serve { visibility: visible; }
  .winner-tag { font-size: 12px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--muted); visibility: hidden; }
  .side.won .winner-tag { visibility: visible; color: var(--text); }
  #setsTable { border-collapse: collapse; }
  #setsTable td { padding: 4px 12px; text-align: center; font-size: 20px;
    font-variant-numeric: tabular-nums; border: 0; }
  #setsTable tr.a td { color: var(--us); }
  #setsTable tr.b td { color: var(--them); }
  #setsTable td sup { font-size: 11px; color: var(--muted); margin-left: 2px; }
  /* Swap sides (decision 7): the two tiles change places, and so do the
     two team buttons of the chooser, so a button always sits under its
     tile. Pure order: every tile keeps its class, its colour, its serve
     dot and its label. On a phone the sets table still drops beneath
     (order 2 and 3 above outrank -1 and 1). */
  #board.swapped #sideA { order: 1; }
  #board.swapped #sideB { order: -1; }
  #board.swapped #teamChoices button[data-team="A"] { order: 1; }
  #board.swapped #teamChoices button[data-team="B"] { order: -1; }
  /* Your team (decision 7): a segmented control, Team A left and Team B
     right like the tiles, Neutral between them. Neutral-styled on
     purpose: the team colours belong to the tiles. The separators are
     the 1 px gaps over the group's line-coloured background, so they
     hold whichever order the buttons are drawn in. */
  #team { display: flex; flex-direction: column; align-items: center;
    gap: 8px; max-width: 100%; }
  #teamLabel { font-size: 12px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); }
  #teamRow { display: flex; align-items: center; gap: 10px;
    max-width: 100%; }
  #teamChoices { display: flex; gap: 1px; background: var(--line);
    border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    flex: 0 1 auto; min-width: 0; }
  #teamChoices button { background: var(--panel); color: var(--muted);
    border: 0; font-size: 14px; font-weight: 600; padding: 10px 16px;
    cursor: pointer; flex: 0 1 auto; min-width: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; }
  #teamChoices button:hover { color: var(--text); }
  #teamChoices button:active { background: var(--line); }
  #teamChoices button[aria-pressed="true"] { background: var(--line);
    color: var(--text); }
  /* The swap toggle beside the chooser: an icon button in the same
     idiom as the Board's (a round toggle next to Personal/Neutral); on,
     the arrows take court blue. */
  #swap { display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px; flex: none; background: var(--panel);
    color: var(--muted); border: 1px solid var(--line); border-radius: 10px;
    cursor: pointer; padding: 0; }
  #swap svg { width: 20px; height: 20px; display: block; }
  #swap:hover { color: var(--text); }
  #swap:active { background: var(--line); }
  #swap[aria-pressed="true"] { background: var(--line); color: var(--us);
    border-color: var(--us); }
  #codeLabel { font-size: 13px; color: var(--muted);
    letter-spacing: 0.14em; }
  #joinForm { display: none; flex-direction: column; align-items: center;
    gap: 16px; }
  #joinForm.show { display: flex; }
  #joinForm p { margin: 0; color: var(--muted); font-size: 15px; }
  #joinForm input { background: var(--panel); border: 1px solid var(--line);
    color: var(--text); font-size: 28px; letter-spacing: 0.3em;
    text-align: center; width: 220px; padding: 12px 8px; border-radius: 10px;
    font-variant-numeric: tabular-nums; }
  #joinForm input:focus { outline: none; border-color: var(--us); }
  #joinForm button { background: var(--us); color: #08111C; border: 0;
    font-size: 16px; font-weight: 600; padding: 12px 32px;
    border-radius: 10px; cursor: pointer; }
  #joinForm button:hover { filter: brightness(1.08); }
  #joinForm button:active { filter: brightness(0.92); }
  #joinError { color: var(--them); font-size: 14px; min-height: 18px;
    margin: 0; }
  #board { display: none; flex-direction: column; align-items: center;
    gap: 28px; width: 100%; }
  #board.show { display: flex; }
</style>
</head>
<body>
<header>
  <div id="sport">rally</div>
  <div id="status"><span id="statusText">live</span><span id="dot"></span></div>
</header>
<main>
  <form id="joinForm">
    <p>Enter the 6-digit code to watch a live match</p>
    <input id="codeInput" inputmode="numeric" autocomplete="one-time-code"
      maxlength="6" placeholder="000000" aria-label="join code">
    <p id="joinError"></p>
    <button type="submit">Watch</button>
  </form>
  <section id="board">
    <div id="banner">
      <div id="bannerTitle">sharing ended</div>
      <div id="bannerHint"></div>
    </div>
    <div id="score">
      <div class="side a" id="sideA">
        <div class="side-name" id="nameA"><span class="label">Team A</span><span class="you">you</span></div>
        <span class="winner-tag">winner</span>
        <div class="points" id="pointsA">0</div>
        <span class="serve"></span>
        <div class="sets-won">sets <b id="setsA">0</b></div>
      </div>
      <table id="setsTable" aria-label="games by set">
        <tr class="a" id="rowA"></tr>
        <tr class="b" id="rowB"></tr>
      </table>
      <div class="side b" id="sideB">
        <div class="side-name" id="nameB"><span class="label">Team B</span><span class="you">you</span></div>
        <span class="winner-tag">winner</span>
        <div class="points" id="pointsB">0</div>
        <span class="serve"></span>
        <div class="sets-won">sets <b id="setsB">0</b></div>
      </div>
    </div>
    <div id="team">
      <div id="teamLabel">Your team</div>
      <div id="teamRow">
        <div id="teamChoices" role="group" aria-label="Your team">
          <button type="button" data-team="A" aria-pressed="false">Team A</button>
          <button type="button" data-team="N" aria-pressed="true">Neutral</button>
          <button type="button" data-team="B" aria-pressed="false">Team B</button>
        </div>
        <button type="button" id="swap" aria-pressed="false" aria-label="Swap sides" title="Swap sides">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <path d="M4 8h14"/><path d="M14 4l4 4-4 4"/>
            <path d="M20 16H6"/><path d="M10 12l-4 4 4 4"/>
          </svg>
        </button>
      </div>
    </div>
    <div id="codeLabel"></div>
  </section>
</main>
<script>
(function () {
  var SUPABASE_URL = "https://cdfssiiyuvdxsfgkjdxz.supabase.co";
  var ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkZnNzaWl5dXZkeHNmZ2tqZHh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzM4ODIsImV4cCI6MjEwMzg0OTg4Mn0.ElGhVvNKSUzxaVgHNG6zeia6ozcsC4kx4JD7_DM5FBA";
  var FN = SUPABASE_URL + "/functions/v1";
  var CODE_RE = /^[1-9][0-9]{5}$/;

  var POLL_MS = 2500;            // steady cadence
  var POLL_SLOW_MS = 10000;      // after SLOW_AFTER consecutive failures
  var SLOW_AFTER = 3;
  var STALE_MS = 20000;          // amber dot without a successful poll
  // The two viewer preferences this page stores, and nothing else:
  // Your team as {"share": <shareId>, "team": "A"|"B"}, valid for that
  // one share (a reload of the same code keeps it, another share
  // starts Neutral); Swap sides as "1", per browser, for every share.
  var TEAM_KEY = "rally.board.team";
  var SWAP_KEY = "rally.board.swap";

  // The sport ids the relay carries (src/sportCatalog.ts), lowercased for
  // the header the same way the app's chips read.
  var SPORTS = {
    padel: "padel", tennis: "tennis", pickleball: "pickleball",
    tabletennis: "table tennis", badminton: "badminton", squash: "squash",
    volleyball: "volleyball", beachvolleyball: "beach volleyball",
    racquetball: "racquetball", custom: "custom"
  };

  var el = function (id) { return document.getElementById(id); };
  var shareId = null;
  var curSeq = -1;
  var curSport = "";
  var lastSnapshot = null;
  var names = null;              // {teamA: [names], teamB: [names]} or null
  var matchOver = false;         // the ended snapshot arrived: the result
  var shareOver = false;         // terminal: the row is gone (404)
  var lastOk = 0;                // time of the last successful join or poll
  var joined = false;
  var inFlight = false;
  var failures = 0;
  var timer = null;
  var team = "N";                // "A" | "B" | "N" (neutral); read per share on join
  var swapped = readSwap();      // per browser: team B drawn left

  function showForm(message) {
    el("board").classList.remove("show");
    el("joinForm").classList.add("show");
    el("joinError").textContent = message || "";
    el("statusText").textContent = "waiting";
    el("dot").className = "off";
  }

  el("joinForm").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = el("codeInput").value.trim();
    if (!CODE_RE.test(v)) {
      el("joinError").textContent = "The code is 6 digits";
      return;
    }
    // Keeps the folder URL (board/?code=), the shape the app shares.
    location.search = "?code=" + v;
  });

  function sportLabel(id) {
    if (typeof id !== "string" || id.length === 0) return "rally";
    return SPORTS[id] || id;
  }

  // --- Your team (decision 7) ------------------------------------------

  // The remembered side for THIS share, else Neutral. A value made for
  // another share (or a bare "A"/"B" from before the choice was keyed
  // by share) is not this match's and is dropped.
  function readTeam(id) {
    try {
      var raw = localStorage.getItem(TEAM_KEY);
      if (!raw) return "N";
      var v = null;
      try { v = JSON.parse(raw); } catch (e) { v = null; }
      if (v && typeof v === "object" && v.share === id &&
          (v.team === "A" || v.team === "B")) {
        return v.team;
      }
      localStorage.removeItem(TEAM_KEY);
      return "N";
    } catch (e) {
      return "N";
    }
  }

  function writeTeam(id, v) {
    try {
      if (v === "N") localStorage.removeItem(TEAM_KEY);
      else localStorage.setItem(TEAM_KEY, JSON.stringify({ share: id, team: v }));
    } catch (e) {
      // A private window or blocked storage: the choice lasts the page.
    }
  }

  function setTeam(v) {
    team = v === "A" || v === "B" ? v : "N";
    if (shareId) writeTeam(shareId, team);
    renderTeam();
    renderNames();
    if (lastSnapshot) renderResult(lastSnapshot);
    setStatus();
  }

  // --- Swap sides (decision 7) ------------------------------------------

  function readSwap() {
    try {
      return localStorage.getItem(SWAP_KEY) === "1";
    } catch (e) {
      return false;
    }
  }

  function writeSwap(on) {
    try {
      if (on) localStorage.setItem(SWAP_KEY, "1");
      else localStorage.removeItem(SWAP_KEY);
    } catch (e) {
      // As above: the setting lasts the page.
    }
  }

  // Only the drawing order changes: A stays A, B stays B, the colours,
  // the serve dot and the names stay with their tiles.
  function renderSwap() {
    el("board").classList.toggle("swapped", swapped);
    el("swap").setAttribute("aria-pressed", swapped ? "true" : "false");
  }

  el("swap").addEventListener("click", function () {
    swapped = !swapped;
    writeSwap(swapped);
    renderSwap();
  });

  function renderTeam() {
    var buttons = el("teamChoices").querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) {
      var b = buttons[i];
      b.setAttribute("aria-pressed", b.getAttribute("data-team") === team ? "true" : "false");
    }
    el("sideA").classList.toggle("mine", team === "A");
    el("sideB").classList.toggle("mine", team === "B");
  }

  el("teamChoices").addEventListener("click", function (e) {
    var target = e.target;
    while (target && target !== this && !(target.tagName === "BUTTON")) {
      target = target.parentNode;
    }
    if (!target || target === this) return;
    setTeam(target.getAttribute("data-team"));
  });

  // --- Participants (decision 10) -------------------------------------

  function nameList(value) {
    if (!Array.isArray(value)) return [];
    var out = [];
    for (var i = 0; i < value.length && out.length < 2; i++) {
      if (typeof value[i] !== "string") continue;
      var cleaned = value[i].replace(/\s+/g, " ").trim().slice(0, 40);
      if (cleaned.length > 0) out.push(cleaned);
    }
    return out;
  }

  function readParticipants(raw) {
    if (typeof raw !== "object" || raw === null || Array.isArray(raw)) {
      return null;
    }
    var teamA = nameList(raw.teamA);
    var teamB = nameList(raw.teamB);
    if (teamA.length === 0 && teamB.length === 0) return null;
    return { teamA: teamA, teamB: teamB };
  }

  // Shortest unambiguous display name within the match (decision 11):
  // first name; first name plus surname initial when two first names
  // collide; the full name when the initial collides too.
  function displayNames(list) {
    var first = list.map(function (n) { return n.split(" ")[0]; });
    var initial = list.map(function (n) {
      var parts = n.split(" ");
      return parts.length > 1 ? parts[parts.length - 1].charAt(0) : "";
    });
    return list.map(function (full, i) {
      var clash = first.some(function (f, j) {
        return j !== i && f.toLowerCase() === first[i].toLowerCase();
      });
      if (!clash) return first[i];
      if (initial[i].length === 0) return full;
      var clashInitial = first.some(function (f, j) {
        return j !== i && f.toLowerCase() === first[i].toLowerCase() &&
          initial[j].toUpperCase() === initial[i].toUpperCase();
      });
      return clashInitial ? full : first[i] + " " + initial[i] + ".";
    });
  }

  // The two side labels: the names when the share carries them, else
  // Team A and Team B.
  function sideLabels() {
    var labelA = "Team A";
    var labelB = "Team B";
    if (names) {
      var all = names.teamA.concat(names.teamB);
      var shown = displayNames(all);
      var a = shown.slice(0, names.teamA.length);
      var b = shown.slice(names.teamA.length);
      if (a.length > 0) labelA = a.join(" & ");
      if (b.length > 0) labelB = b.join(" & ");
    }
    return { a: labelA, b: labelB };
  }

  function renderNames() {
    var labels = sideLabels();
    el("nameA").querySelector(".label").textContent = labels.a;
    el("nameB").querySelector(".label").textContent = labels.b;
    var buttons = el("teamChoices").querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) {
      var side = buttons[i].getAttribute("data-team");
      if (side === "A") buttons[i].textContent = labels.a;
      else if (side === "B") buttons[i].textContent = labels.b;
    }
  }

  // --- The live match ---------------------------------------------------

  function renderSnapshot(snap) {
    var labels = snap.pointLabels || ["0", "0"];
    el("pointsA").textContent = String(labels[0]);
    el("pointsB").textContent = String(labels[1]);
    el("setsA").textContent = String(snap.setsWonA || 0);
    el("setsB").textContent = String(snap.setsWonB || 0);

    var pairs = snap.gamesBySet || snap.setPairs || [];
    var tbs = snap.tiebreaksBySet || [];
    var rowA = el("rowA");
    var rowB = el("rowB");
    rowA.textContent = "";
    rowB.textContent = "";
    for (var i = 0; i < pairs.length; i++) {
      var tdA = document.createElement("td");
      var tdB = document.createElement("td");
      tdA.textContent = String(pairs[i][0]);
      tdB.textContent = String(pairs[i][1]);
      var tb = tbs[i];
      if (tb) {
        var supA = document.createElement("sup");
        supA.textContent = String(tb[0]);
        tdA.appendChild(supA);
        var supB = document.createElement("sup");
        supB.textContent = String(tb[1]);
        tdB.appendChild(supB);
      }
      rowA.appendChild(tdA);
      rowB.appendChild(tdB);
    }

    // The serve dot follows the engine's server while the match is live;
    // an ended snapshot (or a share that is gone) shows no server, and
    // the engine says "no server" itself for a custom game without a
    // serve rule (round 14, decision 3).
    var live = !matchOver && !shareOver;
    el("sideA").classList.toggle("serving", live && snap.server === "A");
    el("sideB").classList.toggle("serving", live && snap.server === "B");
    renderResult(snap);
  }

  // The result, worded from the chosen side (decision 7): "you won" or
  // "you lost" for a side, "Team A won" (or the names) for Neutral, and
  // "match ended" for a match ended by hand with no winner.
  function resultTitle(snap) {
    var winner = snap && (snap.winner === "A" || snap.winner === "B") ? snap.winner : null;
    if (winner === null) return "match ended";
    if (team === "A" || team === "B") return team === winner ? "you won" : "you lost";
    var labels = sideLabels();
    return (winner === "A" ? labels.a : labels.b) + " won";
  }

  function renderResult(snap) {
    el("sideA").classList.toggle("won", snap.winner === "A");
    el("sideB").classList.toggle("won", snap.winner === "B");
    if (matchOver) {
      el("bannerTitle").textContent = resultTitle(snap);
      el("bannerHint").textContent = "";
      el("banner").classList.add("show");
    } else if (!shareOver) {
      el("banner").classList.remove("show");
    }
  }

  // Within a match the seq only moves forward.
  function applySnapshot(seq, snap) {
    if (typeof seq !== "number" || seq <= curSeq || !snap) return;
    curSeq = seq;
    lastSnapshot = snap;
    matchOver = snap.ended === true;
    renderSnapshot(snap);
  }

  // One relay answer (share-join or share-state).
  function applyShare(data) {
    if (typeof data.sport === "string" && data.sport.length > 0) {
      curSport = data.sport;
      el("sport").textContent = sportLabel(curSport);
    }
    names = readParticipants(data.participants);
    renderNames();
    applySnapshot(data.seq, data.snapshot);
    if (lastSnapshot) renderResult(lastSnapshot);
    setStatus();
  }

  // The share is gone (404 on join or poll): the terminal state. After an
  // ended snapshot it is the expected end of the match's share; without
  // one the host stopped sharing mid-match, or the share idled out.
  function markShareEnded() {
    if (shareOver) return;
    shareOver = true;
    clearTimeout(timer);
    if (matchOver && lastSnapshot) {
      el("bannerTitle").textContent = resultTitle(lastSnapshot);
      el("bannerHint").textContent = "";
    } else {
      el("bannerTitle").textContent = "sharing ended";
      el("bannerHint").textContent =
        "The host stopped sharing. The score above is the last one received.";
    }
    el("banner").classList.add("show");
    el("sideA").classList.remove("serving");
    el("sideB").classList.remove("serving");
    setStatus();
  }

  function setStatus() {
    if (!joined) return;
    if (shareOver) {
      el("statusText").textContent = matchOver && lastSnapshot ? resultTitle(lastSnapshot) : "ended";
      el("dot").className = "off";
      return;
    }
    if (matchOver && lastSnapshot) {
      el("statusText").textContent = resultTitle(lastSnapshot);
      el("dot").className = "off";
      return;
    }
    var stale = Date.now() - lastOk > STALE_MS;
    el("dot").className = stale ? "stale" : "";
    el("statusText").textContent = stale ? "stale" : "live";
  }

  // One JSON POST to an edge function. Resolves {status, data}; data is
  // null when the body is not JSON or the status is not 2xx. Rejects only
  // on a network failure.
  function post(path, body) {
    return fetch(FN + path, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        apikey: ANON_KEY,
        Authorization: "Bearer " + ANON_KEY
      },
      body: JSON.stringify(body)
    }).then(function (res) {
      if (!res.ok) return { status: res.status, data: null };
      return res.json().then(
        function (data) { return { status: res.status, data: data }; },
        function () { return { status: res.status, data: null }; }
      );
    });
  }

  function schedule(ms) {
    clearTimeout(timer);
    if (shareOver || !joined || document.hidden) return;
    timer = setTimeout(poll, ms);
  }

  function poll() {
    if (shareOver || !joined || inFlight || document.hidden) return;
    inFlight = true;
    post("/share-state", { shareId: shareId }).then(function (res) {
      inFlight = false;
      if (res.status === 404) {
        // Row gone: the share ended (the match ended and share-end
        // followed, the host stopped, or the TTL swept it).
        markShareEnded();
        return;
      }
      if (!res.data) {
        failures += 1;
        schedule(failures >= SLOW_AFTER ? POLL_SLOW_MS : POLL_MS);
        return;
      }
      failures = 0;
      lastOk = Date.now();
      applyShare(res.data);
      schedule(POLL_MS);
    }, function () {
      inFlight = false;
      failures += 1;
      schedule(failures >= SLOW_AFTER ? POLL_SLOW_MS : POLL_MS);
    });
  }

  function start(code) {
    post("/share-join", { code: code }).then(function (res) {
      if (res.status === 404) {
        showForm("No live match with that code");
        return;
      }
      if (res.status === 429) {
        showForm("Too many attempts. Wait a few minutes and try again");
        return;
      }
      if (!res.data) {
        showForm("Could not reach the score service. Try again");
        return;
      }
      joined = true;
      shareId = res.data.shareId;
      lastOk = Date.now();
      el("joinForm").classList.remove("show");
      el("board").classList.add("show");
      el("codeLabel").textContent = "code " + code;
      el("dot").className = "";
      el("statusText").textContent = "live";
      // The side is this share's: the same code on a reload keeps it,
      // any other share starts Neutral.
      team = typeof shareId === "string" ? readTeam(shareId) : "N";
      renderTeam();
      applyShare(res.data);
      setInterval(setStatus, 1000);
      schedule(POLL_MS);
    }, function () {
      showForm("Could not reach the score service. Try again");
    });
  }

  // Pause while hidden (no background polling), resume with an immediate
  // poll when the tab comes back.
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      clearTimeout(timer);
    } else if (joined && !shareOver) {
      clearTimeout(timer);
      poll();
    }
  });

  renderTeam();
  renderSwap();
  var code = (new URLSearchParams(location.search).get("code") || "").trim();
  if (CODE_RE.test(code)) {
    start(code);
  } else {
    showForm(code ? "The code is 6 digits" : "");
  }
})();
</script>
</body>
</html>
