<!DOCTYPE html>
<!-- Rally live scoreboard (static, GitHub Pages). THE LINK a host shares.
     Followers are free and account-less by product law: this page needs no
     login, loads NO external script, style or font, and stores nothing
     about the match. It joins a share through the share-join edge function
     (POST {code}) and then follows it two ways at once:
       LIVE (feedback round 27, decision 6): it joins the relay's Realtime
       channel "share:<shareId>" over one WebSocket to the same Supabase
       project (the channel the iPhone follow screen uses), so a score
       lands about 0.35 s after the host's upload. While the channel is
       joined, share-state is asked only every 10 s as a safety net.
       ASKING: share-state (POST {shareId}) every 2.5 s whenever the live
       channel is not joined (before it joins, after it drops, in a
       browser without WebSocket), backing off to 10 s after three
       consecutive failures, pausing while the tab is hidden and resuming
       with an immediate ask on visibilitychange.
     Measured on the live relay (tools/relay-latency.mjs, round 27): the
     2.5 s poller saw a score 1.8 s after the upload on average, 3.1 s at
     worst; the Realtime push arrives in about 0.35 s.
     Request and response shapes: supabase/functions/share-join/index.ts,
     share-state/index.ts; the broadcasts (events "snapshot", "participants",
     "ended") come from share-uplink and share-end. share-state carries no
     per-IP rate limit by design (a club's Wi-Fi is one address); share-join
     keeps its 30 per 10 minutes against code guessing.
     A SHARE IS A MATCH (round 14): the ended snapshot is the result and
     TERMINAL (the poll and the channel stop there; round 24 keeps a scored
     end on the relay for 24 hours, so no 404 would ever end the follow).
     A 404 without an ended snapshot means the host stopped sharing mid-match
     or the share idled out: the last score stays with "Sharing ended".
     THE LINK IS NEUTRAL (round 27, decision 2): no side choice here; the
     result reads "<side> won". SWAP SIDES stays: a per-device VIEW
     setting, remembered in localStorage per browser (rally.board.swap);
     the colours, the serve ball and the names stay with their teams. That
     one preference is ALL this page stores; the old side choice
     (rally.board.team) is removed on load.
     THE BOARD IS THE APP'S BOARD (round 27, decision 4): two tinted tiles
     (blue = the host's team, clay = the other, STYLE_GUIDE, load-bearing),
     the side label above the points in INITIALS ("D & J", collisions
     expand, src/players.ts tileLabelsFromNames), the sets as the stacked
     mini-table ALWAYS below the tiles (it scrolls sideways when a best of
     nine outgrows the screen, the newest set in view), the serve as the
     optic ball placed from the viewer's side (src/components/Scoreboard.tsx
     ballJustify: the host's team serves from the NEAR edge on its serve
     court side, the other team from the FAR edge with the sides mirrored,
     centered where the sport has no serve court side) with the serving
     player's NAME beside it when the host's snapshot says which player
     serves (snapshot.serverIndex, round 27, decision 1). A decided match
     shows sets won in the tiles, as the app does. Light and dark follow
     the system.
     THE SPORT READS AS A NAME (decision 3): built-in ids map to their
     names, a saved sport arrives by name (snapshot.sportName). The page
     speaks English or German by the browser's language; ?lang=de|en
     overrides it (the verifier uses that).
     AN X LEAVES (decision 5): back to the code entry, nothing kept.
     The anon key is public by design: it grants nothing, the table is
     service-role-only and every mutation goes through edge functions.
     The app links here through boardUrl() in src/links.ts; the URL shape is
     board/?code=123456 and must stay stable.
     Verified by scripts/verify-board.mjs (headless Edge, the two POSTs
     answered by a scripted relay, the WebSocket by a scripted channel). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Rally live score</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<style>
  /* The app's tokens (STYLE_GUIDE colour table, src/theme.ts). */
  :root {
    --ground: #F4F7F9;
    --surface: #FFFFFF;
    --ink: #16232E;
    --ink-soft: #45586A;
    --ink-faint: #5A6E80;
    --line: #D5DEE6;
    --us: #1A66C7;
    --them: #C75A28;
    --them-ink: #B04A20;
    --us-tile: rgba(26, 102, 199, 0.13);
    --them-tile: rgba(199, 90, 40, 0.13);
    --serve: #B7C821;
    --serve-ink: #16232E;
    --fresh: #2E8B5A;
    --stale: #B8860B;
    --on-accent: #FFFFFF;
    --track: #E4EBF1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0B1622;
      --surface: #101E2D;
      --ink: #E7EEF4;
      --ink-soft: #A7B8C7;
      --ink-faint: #74879A;
      --line: #22374B;
      --us: #5B96E8;
      --them: #E08350;
      --them-ink: #E08350;
      --us-tile: rgba(91, 150, 232, 0.22);
      --them-tile: rgba(224, 131, 80, 0.22);
      --serve: #D9E44A;
      --serve-ink: #16232E;
      --fresh: #4EA97C;
      --stale: #D9A13B;
      /* Round 27 review: white on the dark-mode blue is 3.0:1; the
         ground's ink reads 6.8:1. */
      --on-accent: #0B1622;
      --track: #16283A;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI",
      Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; }

  /* Header: the X (left), the sport (center), the connection (right). */
  header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    width: 100%;
    max-width: 1004px;
    margin: 0 auto;
    padding: calc(10px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px));
  }
  #leave {
    justify-self: end;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border: 0; border-radius: 22px; padding: 0;
    background: transparent; color: var(--ink-soft);
    cursor: pointer; visibility: hidden;
  }
  #leave svg { width: 22px; height: 22px; display: block; }
  #leave:hover { background: var(--track); color: var(--ink); }
  #leave:active { opacity: 0.7; }
  body.following #leave { visibility: visible; }
  #sport {
    font-size: 17px; font-weight: 600; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 52vw; text-align: center;
  }
  #status {
    justify-self: start;
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; color: var(--ink-faint);
    visibility: hidden; white-space: nowrap;
  }
  body.following #status { visibility: visible; }
  #dot { width: 9px; height: 9px; border-radius: 50%; flex: none;
    background: var(--fresh); }
  #dot.stale { background: var(--stale); }
  #dot.off { background: var(--ink-faint); }

  main {
    flex: 1;
    width: 100%;
    max-width: 980px;
    margin: 0 auto;
    padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    display: flex;
    flex-direction: column;
  }

  /* --- The code entry ------------------------------------------------ */
  #joinForm {
    display: none;
    flex: 1;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    text-align: center;
    padding-bottom: 8vh;
  }
  #joinForm.show { display: flex; }
  .mark { display: flex; gap: 5px; margin-bottom: 6px; }
  .mark span { width: 18px; height: 34px; border-radius: 7px; background: var(--us); }
  .mark span + span { background: var(--them); }
  #joinForm h1 { margin: 0; font-size: 28px; line-height: 34px; font-weight: 700;
    letter-spacing: -0.02em; }
  #joinHint { margin: 0; color: var(--ink-soft); font-size: 16px; max-width: 26em; }
  #codeInput {
    margin-top: 10px;
    width: min(280px, 100%);
    background: var(--surface); color: var(--ink);
    border: 1.5px solid var(--line); border-radius: 16px;
    font-size: 32px; font-weight: 600; letter-spacing: 0.32em;
    text-indent: 0.32em; text-align: center;
    padding: 14px 8px; font-variant-numeric: tabular-nums;
  }
  #codeInput::placeholder { color: var(--line); }
  #codeInput:focus { outline: none; border-color: var(--us); }
  #joinButton {
    width: min(280px, 100%); min-height: 52px;
    border: 0; border-radius: 26px;
    background: var(--us); color: var(--on-accent);
    font-size: 17px; font-weight: 600; cursor: pointer;
  }
  #joinButton:hover { filter: brightness(1.06); }
  #joinButton:active { opacity: 0.75; }
  #joinError { margin: 0; min-height: 20px; color: var(--them-ink); font-size: 15px; }

  /* --- The board ----------------------------------------------------- */
  /* The block centers in the height it has once the tiles reach their
     ceiling (the app Board's rule), so a tall phone has no dead band. */
  #board { display: none; flex: 1; flex-direction: column; justify-content: center; gap: 18px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  #board.show { display: flex; }

  /* The result or the end, above the tiles. */
  #banner { display: none; flex-direction: column; align-items: center;
    gap: 4px; text-align: center; padding: 4px 8px 0; }
  #banner.show { display: flex; }
  #bannerTitle { font-size: 22px; line-height: 28px; font-weight: 700; }
  #bannerHint { font-size: 15px; color: var(--ink-soft); max-width: 32em; }
  #bannerHint:empty { display: none; }

  #tiles { display: flex; gap: 12px; flex: 1;
    min-height: 220px; max-height: 460px; }
  #board.swapped #tiles { flex-direction: row-reverse; }
  .tile {
    position: relative;
    flex: 1 1 0; min-width: 0;
    border-radius: 24px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 2px;
    padding: 44px 12px;
    overflow: hidden;
  }
  .tile.a { background: var(--us-tile); }
  .tile.b { background: var(--them-tile); }
  .who { max-width: 100%; font-size: 13px; font-weight: 600;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .points { font-size: clamp(80px, 24vw, 188px); line-height: 1.08;
    font-weight: 800; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tile.a .points { color: var(--us); }
  .tile.b .points { color: var(--them); }
  /* The ball lane: the near (bottom) edge for the host's team, the far
     (top) edge for the other; justify-content comes from ballJustify(). */
  .lane { position: absolute; left: 14px; right: 14px;
    display: none; align-items: center; gap: 7px; }
  .tile.serving .lane { display: flex; }
  .tile.a .lane { bottom: 14px; }
  .tile.b .lane { top: 14px; }
  .ball { width: 20px; height: 20px; border-radius: 50%; flex: none;
    background: var(--serve); color: var(--serve-ink);
    font-size: 11px; font-weight: 800; line-height: 20px; text-align: center; }
  /* A long name wraps to a second line on a narrow tile instead of
     cutting "serves" short. */
  .serve-name { min-width: 0; font-size: 13px; line-height: 16px; font-weight: 600;
    color: var(--ink-soft); overflow: hidden; display: -webkit-box;
    -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }
  .serve-name:empty { display: none; }

  /* The sets: the stacked mini-table, always below the tiles. It
     scrolls sideways inside its own box when it outgrows the width. */
  /* Auto margins center the row while it fits and let it scroll from
     its first set when it does not (justify-content: center would clip
     the start of an overflowing row out of reach). */
  #sets { display: flex; overflow-x: auto;
    scrollbar-width: none; min-height: 56px; }
  #sets::-webkit-scrollbar { display: none; }
  #setRow { display: flex; gap: 22px; margin: 0 auto; padding: 0 4px; }
  #setRow.dense { gap: 14px; }
  #setRow.denser { gap: 10px; }
  .set { display: flex; flex-direction: column; align-items: center;
    gap: 2px; min-width: 26px; }
  .set b { font-size: 24px; line-height: 28px; font-weight: 700;
    font-variant-numeric: tabular-nums; color: var(--ink-faint); }
  .set b.live { color: var(--ink); }
  .set b.won-a { color: var(--us); }
  .set b.won-b { color: var(--them); }
  .set small { font-size: 12px; font-weight: 600; margin-left: 2px; }

  /* The controls: swap sides, and the code. */
  #controls { display: flex; align-items: center; justify-content: center;
    gap: 14px; flex-wrap: wrap; }
  #swap { display: flex; align-items: center; gap: 8px;
    min-height: 44px; padding: 0 18px;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: 22px;
    font-size: 15px; font-weight: 600; cursor: pointer; }
  #swap svg { width: 18px; height: 18px; display: block; color: var(--ink-soft); }
  #swap:hover { border-color: var(--ink-faint); }
  #swap:active { opacity: 0.75; }
  #swap[aria-pressed="true"] { border-color: var(--us); }
  #swap[aria-pressed="true"] svg { color: var(--us); }
  #codeLabel { font-size: 14px; color: var(--ink-faint);
    font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }

  footer { text-align: center; padding: 6px 16px calc(14px + env(safe-area-inset-bottom, 0px)); }
  footer a { color: var(--ink-faint); font-size: 13px; text-decoration: none; }
  footer a:hover { color: var(--ink-soft); text-decoration: underline; }

  /* Wide screens (a laptop, a TV courtside; feedback round 27, second
     pass): the current score stays the focus, and everything around it
     grows WITH the screen instead of staying phone-sized, so the page
     reads in balance from 900 px to a 4K TV. Every size is a clamp on
     the viewport, capped where more would only shout. */
  @media (min-width: 900px) {
    header { max-width: min(1500px, 92vw); padding-left: 20px; padding-right: 20px; }
    main { max-width: min(1476px, 90vw); }
    #sport { font-size: clamp(18px, 1.1vw + 8px, 34px); }
    #status { font-size: clamp(14px, 0.7vw + 8px, 26px); gap: clamp(8px, 0.5vw, 12px); }
    #dot { width: clamp(9px, 0.6vw, 14px); height: clamp(9px, 0.6vw, 14px); }
    #leave { width: clamp(44px, 2.8vw + 8px, 64px); height: clamp(44px, 2.8vw + 8px, 64px); border-radius: 50%; }
    #leave svg { width: clamp(22px, 1.4vw + 4px, 32px); height: clamp(22px, 1.4vw + 4px, 32px); }
    #board { gap: clamp(18px, 1.6vw, 34px); }
    #banner { gap: clamp(4px, 0.4vw, 8px); }
    #bannerTitle { font-size: clamp(22px, 1.8vw + 8px, 52px); line-height: 1.25; }
    #bannerHint { font-size: clamp(15px, 0.6vw + 8px, 22px); }
    #tiles { gap: clamp(20px, 1.6vw, 36px); min-height: 340px; max-height: min(62vh, 760px); }
    .tile { border-radius: clamp(32px, 2vw, 48px); padding: clamp(44px, 4vw, 84px) 16px; }
    .who { font-size: clamp(15px, 1vw + 6px, 32px); }
    .points { font-size: clamp(120px, min(15vw, 30vh), 320px); }
    .lane { left: clamp(20px, 1.6vw, 34px); right: clamp(20px, 1.6vw, 34px); gap: clamp(9px, 0.7vw, 14px); }
    .tile.a .lane { bottom: clamp(20px, 1.6vw, 34px); }
    .tile.b .lane { top: clamp(20px, 1.6vw, 34px); }
    .ball { width: clamp(28px, 1.8vw + 10px, 56px); height: clamp(28px, 1.8vw + 10px, 56px);
      line-height: clamp(28px, 1.8vw + 10px, 56px); font-size: clamp(14px, 0.8vw + 5px, 26px); }
    .serve-name { font-size: clamp(16px, 0.9vw + 7px, 30px); line-height: 1.25; }
    #sets { min-height: clamp(56px, 4.5vw, 110px); }
    #setRow { gap: clamp(22px, 1.8vw, 40px); }
    #setRow.dense { gap: clamp(14px, 1.2vw, 28px); }
    #setRow.denser { gap: clamp(10px, 0.9vw, 22px); }
    .set b { font-size: clamp(28px, 2vw + 8px, 60px); line-height: 1.15; }
    .set small { font-size: clamp(12px, 0.5vw + 6px, 20px); }
    #controls { gap: clamp(14px, 1vw, 24px); }
    #swap { min-height: clamp(44px, 2.6vw + 14px, 72px); padding: 0 clamp(18px, 1.4vw, 32px);
      border-radius: 999px; font-size: clamp(15px, 0.7vw + 8px, 26px); gap: clamp(8px, 0.6vw, 14px); }
    #swap svg { width: clamp(18px, 1vw + 6px, 32px); height: clamp(18px, 1vw + 6px, 32px); }
    #codeLabel { font-size: clamp(14px, 0.7vw + 8px, 26px); }
    footer a { font-size: clamp(13px, 0.4vw + 8px, 18px); }
  }
  /* Short landscape phones: everything fits one screen; the tiles give
     up height first and the footer steps aside. */
  @media (max-height: 460px) {
    header { padding-top: calc(4px + env(safe-area-inset-top, 0px)); padding-bottom: 2px; }
    main { padding-top: 0; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
    #board { gap: 8px; }
    #banner { padding-top: 0; }
    #bannerTitle { font-size: 18px; line-height: 22px; }
    #bannerHint { font-size: 13px; }
    #tiles { min-height: 0; }
    /* Round 27 review: the lane (10 px in, a 20 px ball) sits inside the
       tile's own padding, so it never covers the side label or the score;
       the score follows the height as well as the width. */
    .tile { padding: 36px 12px; }
    .tile.a .lane { bottom: 8px; }
    .tile.b .lane { top: 8px; }
    .lane { left: 12px; right: 12px; }
    .points { font-size: clamp(44px, min(13vw, 19vh), 120px); }
    #sets { min-height: 44px; }
    .set b { font-size: 20px; line-height: 23px; }
    #swap { min-height: 40px; }
    footer { display: none; }
  }
</style>
</head>
<body>
<header>
  <div id="status"><span id="dot"></span><span id="statusText"></span></div>
  <div id="sport">Rally</div>
  <button type="button" id="leave" aria-label="Leave match" title="Leave match">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>
</header>
<main>
  <form id="joinForm" novalidate>
    <div class="mark" aria-hidden="true"><span></span><span></span></div>
    <h1 id="joinTitle">Follow a live match</h1>
    <p id="joinHint">Enter the 6-digit code from the host.</p>
    <input id="codeInput" inputmode="numeric" autocomplete="one-time-code"
      maxlength="6" placeholder="000000" aria-label="Code">
    <button type="submit" id="joinButton">Follow</button>
    <p id="joinError" role="alert"></p>
  </form>
  <div id="announce" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <section id="board">
    <div id="banner">
      <div id="bannerTitle"></div>
      <div id="bannerHint"></div>
    </div>
    <div id="tiles">
      <div class="tile a" id="tileA">
        <div class="who" id="nameA">Team A</div>
        <div class="points" id="pointsA">0</div>
        <div class="lane" id="laneA"><span class="ball" id="ballA"></span><span class="serve-name" id="serveA"></span></div>
      </div>
      <div class="tile b" id="tileB">
        <div class="who" id="nameB">Team B</div>
        <div class="points" id="pointsB">0</div>
        <div class="lane" id="laneB"><span class="ball" id="ballB"></span><span class="serve-name" id="serveB"></span></div>
      </div>
    </div>
    <div id="sets" aria-label="Sets"><div id="setRow"></div></div>
    <div id="controls">
      <button type="button" id="swap" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 8h14"/><path d="M14 4l4 4-4 4"/><path d="M20 16H6"/><path d="M10 12l-4 4 4 4"/></svg>
        <span id="swapLabel">Swap sides</span>
      </button>
      <span id="codeLabel"></span>
    </div>
  </section>
</main>
<footer><a href="../" id="scoredWith">Scored with Rally</a></footer>
<script>
(function () {
  var SUPABASE_URL = "https://cdfssiiyuvdxsfgkjdxz.supabase.co";
  var ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNkZnNzaWl5dXZkeHNmZ2tqZHh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgyNzM4ODIsImV4cCI6MjEwMzg0OTg4Mn0.ElGhVvNKSUzxaVgHNG6zeia6ozcsC4kx4JD7_DM5FBA";
  var FN = SUPABASE_URL + "/functions/v1";
  var WS_URL = SUPABASE_URL.replace(/^http/, "ws") +
    "/realtime/v1/websocket?apikey=" + ANON_KEY + "&vsn=1.0.0";
  var CODE_RE = /^[1-9][0-9]{5}$/;

  var POLL_MS = 2500;            // asking, while the live channel is not joined
  var POLL_LIVE_MS = 10000;      // the safety net while it is
  var POLL_SLOW_MS = 10000;      // after SLOW_AFTER consecutive failures
  var SLOW_AFTER = 3;
  var STALE_MS = 20000;          // amber dot without a fresh answer
  var HEARTBEAT_MS = 25000;      // Phoenix heartbeat (the server drops at 60 s)
  var RECONNECT_MS = [1000, 2000, 5000, 10000];
  var SWAP_KEY = "rally.board.swap";

  // --- Language (decision 3) ------------------------------------------
  var TEXT = {
    en: {
      live: "Live", reconnecting: "Reconnecting", final: "Final", ended: "Ended",
      teamA: "Team A", teamB: "Team B",
      won: "{name} won", matchEnded: "Match ended",
      sharingEnded: "Sharing ended",
      sharingEndedHint: "The host stopped sharing. This is the last score received.",

      schedule(cadence());
    }, function () {
      inFlight = false;
      if (!joined || shareOver) return;
      failures += 1;
      schedule(endedPending ? 0 : cadence());
      endedPending = false;
    });
  }

  // --- Live: the relay's Realtime channel (decision 6) ---------------------
  // Phoenix protocol v1 (JSON), the one supabase-js speaks: join the topic
  // "realtime:share:<id>", heartbeat on "phoenix", read "broadcast" events.

  function wsSend(message) {
    if (!ws || ws.readyState !== 1) return;
    try { ws.send(JSON.stringify(message)); } catch (e) { /* the close handler follows */ }
  }

  function startLive() {
    if (!("WebSocket" in window) || !shareId || shareOver || ws) return;
    var topic = "realtime:share:" + shareId;
    var socket;
    try { socket = new WebSocket(WS_URL); } catch (e) { scheduleReconnect(); return; }
    ws = socket;
    socket.onopen = function () {
      wsRef += 1;
      wsSend({
        topic: topic,
        event: "phx_join",
        payload: {
          config: {
            broadcast: { ack: false, self: false },
            presence: { key: "" },
            postgres_changes: [],
            "private": false
          },
          access_token: ANON_KEY
        },
        ref: String(wsRef),
        join_ref: String(wsRef)
      });
      clearInterval(heartbeat);
      lastHeartbeatReply = Date.now();
      heartbeat = setInterval(function () {
        // Round 27 review: a socket that died without a close event stops
        // answering heartbeats; two missed replies close it, which falls
        // back to asking and reconnects.
        if (Date.now() - lastHeartbeatReply > HEARTBEAT_MS * 2 + 5000) {
          try { socket.close(); } catch (e) { /* the close handler follows */ }
          if (ws === socket) { ws = null; liveJoined = false; clearInterval(heartbeat); schedule(cadence()); scheduleReconnect(); }
          return;
        }
        wsRef += 1;
        wsSend({ topic: "phoenix", event: "heartbeat", payload: {}, ref: String(wsRef) });
      }, HEARTBEAT_MS);
    };
    socket.onmessage = function (event) {
      var m = null;
      try { m = JSON.parse(event.data); } catch (e) { return; }
      if (!m) return;
      if (m.topic === "phoenix") {
        // The heartbeat's reply: the socket is alive (round 27 review).
        if (m.event === "phx_reply") lastHeartbeatReply = Date.now();
        return;
      }
      if (m.topic !== topic) return;
      if (m.event === "phx_reply" && m.payload && m.payload.status === "ok" && !liveJoined) {
        liveJoined = true;
        reconnects = 0;
        // Anything scored while the channel was down: one ask, then the
        // slow safety net.
        clearTimeout(timer);
        poll();
        return;
      }
      if (m.event === "phx_error" || m.event === "phx_close") {
        socket.close();
        return;
      }
      if (m.event !== "broadcast" || !m.payload) return;
      var kind = m.payload.event;
      var data = m.payload.payload || {};
      if (kind === "snapshot") {
        lastOk = Date.now();
        // A score push carries the row's names too (round 27 verify).
        if ("participants" in data) namesPushedAt = Date.now();
        applyShare(data);
        if (matchOver) markShareEnded();
      } else if (kind === "participants") {
        lastOk = Date.now();
        namesPushedAt = Date.now();
        applyShare({ participants: data.participants });
      } else if (kind === "ended") {
        // The host ended the share: the relay has the final state. An ask
        // already on the wire read the row before the end, so it asks
        // again when it lands (round 27 review).
        if (inFlight) {
          endedPending = true;
        } else {
          clearTimeout(timer);
          poll();
        }
      }
    };
    socket.onclose = function () {
      // Round 27 verify: a socket the watchdog or stopLive already
      // detached closes late (Chromium waits up to 60 s on a dead
      // connection); by then `heartbeat` and liveJoined belong to its
      // replacement, and whoever detached it did the cleanup.
      if (ws !== socket) return;
      ws = null;
      liveJoined = false;
      clearInterval(heartbeat);
      if (shareOver) return;
      // Back to asking until the channel is back.
      schedule(cadence());
      scheduleReconnect();
    };
    socket.onerror = function () { /* onclose follows */ };
  }

  function scheduleReconnect() {
    clearTimeout(reconnectTimer);
    if (shareOver || !joined) return;
    var wait = RECONNECT_MS[Math.min(reconnects, RECONNECT_MS.length - 1)];
    reconnects += 1;
    reconnectTimer = setTimeout(function () {
      if (!document.hidden) startLive();
    }, wait);
  }

  function stopLive() {
    clearTimeout(reconnectTimer);
    clearInterval(heartbeat);
    liveJoined = false;
    if (ws) {
      var socket = ws;
      ws = null;
      try { socket.close(); } catch (e) { /* already closed */ }
    }
  }

  // --- Join -------------------------------------------------------------------

  function start(code) {
    post("/share-join", { code: code }).then(function (res) {
      if (res.status === 404) { showForm(T.errNotFound); return; }
      if (res.status === 429) { showForm(T.errTooMany); return; }
      if (!res.data) { showForm(T.errNetwork); return; }
      joined = true;
      shareId = res.data.shareId;
      lastOk = Date.now();
      document.body.classList.add("following");
      el("joinForm").classList.remove("show");
      el("board").classList.add("show");
      el("codeLabel").textContent = fill(T.code, { code: code.slice(0, 3) + " " + code.slice(3) });
      applyShare(res.data);
      setInterval(setStatus, 1000);
      if (matchOver) {
        markShareEnded();
        return;
      }
      startLive();
      schedule(POLL_MS);
    }, function () {
      showForm(T.errNetwork);
    });
  }

  // Pause asking while hidden, resume with an immediate ask when the tab
  // comes back (and bring the channel back if it dropped meanwhile).
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) {
      clearTimeout(timer);
    } else if (joined && !shareOver) {
      clearTimeout(timer);
      poll();
      if (!ws) startLive();
    }
  });

  applyLanguage();
  renderSwap();
  var code = (params.get("code") || "").trim();
  if (CODE_RE.test(code)) {
    el("sport").textContent = "Rally";
    start(code);
  } else {
    showForm(code ? T.errDigits : "");
  }
})();
</script>
</body>
</html>
